name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: python -m pip install pycodestyle

      - name: Check syntax (py_compile)
        run: python -m py_compile $(find . -name "*.py")

      - name: Check PEP-8 style
        run: python -m pycodestyle --max-line-length=120 $(find . -name "*.py")
